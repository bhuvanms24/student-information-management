<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Information Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #1f4e79;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 180px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #1f4e79;
            color: white;
        }

        button:hover {
            background-color: #163a5c;
        }

        .delete-btn {
            background-color: #dc3545;
        }

        .delete-btn:hover {
            background-color: #b02a37;
        }

        .update-btn {
            background-color: #198754;
        }

        .update-btn:hover {
            background-color: #146c43;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #1f4e79;
            color: white;
        }

        #message {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Student Information Management System</h1>
    <p>Node.js + Express</p>
</header>

<div class="container">

    <!-- Add Student -->
    <div class="card">

        <h2>Add Student</h2>

        <input
            type="text"
            id="name"
            placeholder="Student Name"
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="text"
            id="course"
            placeholder="Course"
        >

        <input
            type="number"
            id="age"
            placeholder="Age"
        >

        <br>

        <button onclick="addStudent()">
            Add Student
        </button>

        <div id="message"></div>

    </div>


    <!-- Search Student -->
    <div class="card">

        <h2>Search Student</h2>

        <input
            type="text"
            id="searchName"
            placeholder="Enter student name"
        >

        <button onclick="searchStudent()">
            Search
        </button>

        <button onclick="loadStudents()">
            Display All
        </button>

    </div>


    <!-- Student List -->
    <div class="card">

        <h2>Student List</h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Age</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody id="studentTableBody">

            </tbody>

        </table>

    </div>

</div>


<script>

    // Load all students
    async function loadStudents() {

        try {

            const response = await fetch("/api/students");

            const students = await response.json();

            displayStudents(students);

        } catch (error) {

            console.error(error);

        }

    }


    // Display students in table
    function displayStudents(students) {

        const tableBody =
            document.getElementById("studentTableBody");

        tableBody.innerHTML = "";

        students.forEach(student => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${student.id}</td>

                <td>${student.name}</td>

                <td>${student.email}</td>

                <td>${student.course}</td>

                <td>${student.age}</td>

                <td>

                    <button
                        class="update-btn"
                        onclick="updateStudent(${student.id})">
                        Update
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteStudent(${student.id})">
                        Delete
                    </button>

                </td>
            `;

            tableBody.appendChild(row);

        });

    }


    // Add student
    async function addStudent() {

        const name =
            document.getElementById("name").value;

        const email =
            document.getElementById("email").value;

        const course =
            document.getElementById("course").value;

        const age =
            document.getElementById("age").value;


        if (!name || !email || !course || !age) {

            document.getElementById("message").textContent =
                "Please fill all fields.";

            return;
        }


        try {

            const response = await fetch(
                "/api/students",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name,
                        email,
                        course,
                        age: Number(age)
                    })
                }
            );


            const student = await response.json();


            document.getElementById("message").textContent =
                `Student ${student.name} added successfully.`;


            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("course").value = "";
            document.getElementById("age").value = "";


            loadStudents();

        } catch (error) {

            document.getElementById("message").textContent =
                "Error adding student.";

        }

    }


    // Search student
    async function searchStudent() {

        const name =
            document.getElementById("searchName").value;


        try {

            const response = await fetch(
                `/api/students/search?name=${encodeURIComponent(name)}`
            );

            const students = await response.json();

            displayStudents(students);

        } catch (error) {

            console.error(error);

        }

    }


    // Update student
    async function updateStudent(id) {

        const name =
            prompt("Enter new student name:");

        if (!name) {
            return;
        }


        const email =
            prompt("Enter new email:");

        if (!email) {
            return;
        }


        const course =
            prompt("Enter new course:");

        if (!course) {
            return;
        }


        const age =
            prompt("Enter new age:");

        if (!age) {
            return;
        }


        try {

            const response = await fetch(
                `/api/students/${id}`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name,
                        email,
                        course,
                        age: Number(age)
                    })
                }
            );


            const result = await response.json();

            alert("Student updated successfully.");

            loadStudents();

        } catch (error) {

            alert("Error updating student.");

        }

    }


    // Delete student
    async function deleteStudent(id) {

        const confirmDelete =
            confirm("Are you sure you want to delete this student?");


        if (!confirmDelete) {
            return;
        }


        try {

            const response = await fetch(
                `/api/students/${id}`,
                {
                    method: "DELETE"
                }
            );


            const result = await response.json();

            alert(result.message);

            loadStudents();

        } catch (error) {

            alert("Error deleting student.");

        }

    }


    // Automatically load students when page opens
    loadStudents();

</script>

</body>
</html>
